---
layout: default
---
<article class="essay">
  <header class="essay-header">
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="deck">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <div class="essay-body">
    {{ content }}
  </div>
</article>
